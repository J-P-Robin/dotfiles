unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

set -g prefix C-Space

set -g mouse on

set -g extended-keys always
# Report modified keys in kitty CSI-u format (opencode TUI doesn't parse the default xterm modifyOtherKeys format)
set -g extended-keys-format csi-u

# True color (24-bit) passthrough for the outer terminal (Warp uses xterm-256color)
# extkeys: request extended keys from the outer terminal so Shift+Enter etc. reach panes (opencode newlines)
set -as terminal-features ",xterm*:RGB:extkeys"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key C-q kill-session
bind-key C-k kill-server
bind-key C-d detach

set-option -g status-position top

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

set -g @sessionx-bind 'o'

# THEME - catppuccin
if-shell -b '[ $THEME_MODE = "light" ]' 'set -g @catppuccin_flavor "latte"' 'set -g @catppuccin_flavor "mocha"'

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

# Keep the current tmux session name visible beside the window list.
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

# THEME - custom
set -g @catppuccin_status_background "default"
set -g @catppuccin_pane_border_status "top"

run '~/.tmux/plugins/tpm/tpm'
